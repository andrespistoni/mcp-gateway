name: candidato-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  advertencia-ambiental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advertir si falta evidencia real
        run: bash scripts/check-release-gates.sh

  empaquetar:
    needs: advertencia-ambiental
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Calidad de la candidata
        run: |
          test -z "$(gofmt -l .)"
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...
      - name: Construir y verificar contenidos
        run: bash scripts/build-release.sh --version "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-gateway-${{ github.ref_name }}
          path: dist/
